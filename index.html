<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud Gaming Embed Test</title>
  <style>
    body { font-family: sans-serif; background: #111; color: #eee; padding: 20px; }
    .btn { display: inline-block; margin: 5px; padding: 10px 16px; background: #2d2d2d;
           color: #fff; border: 1px solid #555; border-radius: 6px; cursor: pointer; }
    .btn:hover { background: #3d3d3d; }
    iframe { width: 100%; height: 75vh; border: none; margin-top: 15px; background: #000; }
  </style>
</head>
<body>
  <h2>Switch Service:</h2>
  <button class="btn" onclick="load('https://www.xbox.com/play')">Xbox Cloud</button>
  <button class="btn" onclick="load('https://play.geforcenow.com')">GeForce NOW</button>
  <button class="btn" onclick="load('https://play.retro.games')">Retro (web)</button>

  <iframe id="game-frame" src="about:blank" allow="fullscreen; gamepad"></iframe>

  <script>
    function load(url) {
      document.getElementById('game-frame').src = url;
    }
  </script>
</body>
</html>
